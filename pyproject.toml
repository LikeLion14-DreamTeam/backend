[project]
name = "dreamteam-backend"
version = "0.1.0"
description = ""
authors = [
    {name = "hscs12",email = "heesun5795@naver.com"}
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "django (>=6.0.7,<7.0.0)",
    "djangorestframework (>=3.15.0,<4.0.0)",
    "djangorestframework-simplejwt (>=5.3.0,<6.0.0)",
    "drf-yasg (>=1.21.15,<2.0.0)",
    "django-cors-headers (>=4.9.0,<5.0.0)",
    "mysqlclient (>=2.2.8,<3.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "google-auth (>=2.35.0,<3.0.0)",
    "opencv-python (>=4.9,<5.0)",
    "pillow (>=12.3.0,<13.0.0)",
    "open-clip-torch (>=3.3.0,<4.0.0)",
]

[tool.poetry]
# Django 프로젝트라 배포용 패키지로 빌드/설치할 필요가 없음 — 의존성 관리 용도로만 poetry 사용.
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
